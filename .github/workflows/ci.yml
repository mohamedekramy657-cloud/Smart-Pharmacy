# CI pipeline. Written for GitHub Actions; NOT executed from the build sandbox (no CI runner there).
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_USER: pharma, POSTGRES_PASSWORD: pharma_ci_password, POSTGRES_DB: pharma_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pharma" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://pharma:pharma_ci_password@localhost:5432/pharma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build -w apps/api
      - run: npm test -w apps/api
      - run: npx tsc --noEmit -p apps/web/tsconfig.json
      - run: npm run build -w apps/web
  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t smart-pharmacy-api:ci .
      - run: docker build -f apps/web/Dockerfile -t smart-pharmacy-web:ci .
